name: Native Outline binaries

on:
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 4 * * *'
    - cron: '0 5 * * *'
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: Version channel
        required: true
        type: choice
        options: [stable, prerelease, development, dbby]
      ref:
        description: Optional exact source tag or development commit SHA
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: outline-ss-server-native-binaries
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      has_targets: ${{ steps.resolve.outputs.has_targets }}
      targets: ${{ steps.resolve.outputs.targets }}
    steps:
      - id: resolve
        name: Resolve upstream version channel
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          import json, locale, os, re, subprocess, urllib.request

          repo = "https://github.com/OutlineFoundation/tunnel-server"
          api = "https://api.github.com/repos/OutlineFoundation/tunnel-server"
          fork_repo = "DobbyVPN/outliner-tunnel-server-fork"
          def get(url):
              req = urllib.request.Request(url, headers={
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "DobbyVPN-native-binary-workflow"})
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)
          def tags():
              text = subprocess.check_output(
                  ["git", "ls-remote", "--tags", "--refs", repo + ".git"], text=True)
              return {line.split("\t", 1)[1].removeprefix("refs/tags/")
                      for line in text.splitlines() if "\t" in line}
          def tagged_commits(repository):
              text = subprocess.check_output(
                  ["git", "ls-remote", "--tags", repository + ".git"], text=True)
              result = {}
              peeled = {}
              for line in text.splitlines():
                  if "\t" not in line:
                      continue
                  sha, ref = line.split("\t", 1)
                  name = ref.removeprefix("refs/tags/")
                  if name.endswith("^{}"):
                      peeled[name[:-3]] = sha
                  else:
                      result[name] = sha
              result.update(peeled)
              return result

          stable = re.compile(r"^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$")
          prerelease = re.compile(
              r"^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)-"
              r"[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*$")
          dbby_tag = re.compile(
              r"^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)-dbby$")
          if os.environ["EVENT_NAME"] == "schedule":
              channel = {"0 3 * * *": "stable", "0 4 * * *": "development",
                         "0 5 * * *": "prerelease", "0 6 * * *": "dbby"}.get(
                             os.environ.get("EVENT_SCHEDULE"))
              if not channel:
                  raise SystemExit("Unknown schedule")
          else:
              channel = os.environ["INPUT_CHANNEL"]
          requested = os.environ.get("INPUT_REF", "").strip()
          result = []
          if channel == "development":
              if requested and requested != "master":
                  if not re.fullmatch(r"[0-9a-f]{40}", requested):
                      raise SystemExit("Development ref must be master or a full SHA")
                  sha = requested
              else:
                  ref = subprocess.check_output(
                      ["git", "ls-remote", "--exit-code", repo + ".git", "refs/heads/master"],
                      text=True)
                  sha = ref.split()[0]
              commit = get(f"{api}/commits/{sha}")
              date = datetime.fromisoformat(
                  commit["commit"]["committer"]["date"].replace("Z", "+00:00")
              ).astimezone(timezone.utc)
              result.append({"channel": channel,
                  "tag": f"dev-{date.strftime('%y%b%d')}-{sha[:12]}",
                  "ref": sha, "sha": sha, "source_repo": "OutlineFoundation/tunnel-server",
                  "latest": False})
          elif channel == "dbby":
              remote = tagged_commits(f"https://github.com/{fork_repo}")
              if requested:
                  tag = requested if requested.startswith("v") else "v" + requested
                  if not dbby_tag.fullmatch(tag) or tag not in remote:
                      raise SystemExit(f"Not a tagged DobbyVPN fork release: {tag}")
                  candidates = [tag]
              else:
                  candidates = sorted(
                      (tag for tag in remote if dbby_tag.fullmatch(tag)),
                      key=lambda tag: (tuple(map(int, dbby_tag.fullmatch(tag).groups())), tag))
              result = []
              if candidates:
                  upstream_tags = tagged_commits(repo)
                  for tag in candidates:
                      base_ref = tag.removesuffix("-dbby")
                      if base_ref not in upstream_tags:
                          raise SystemExit(f"Missing matching upstream base tag: {base_ref}")
                      result.append({"channel": channel, "tag": tag, "ref": tag,
                          "sha": remote[tag], "source_repo": fork_repo,
                          "upstream_base_repo": "OutlineFoundation/tunnel-server",
                          "upstream_base_ref": base_ref,
                          "upstream_base_sha": upstream_tags[base_ref],
                          "latest": False})
          else:
              remote = tags()
              latest = get(f"{api}/releases/latest")["tag_name"]
              latest_match = stable.fullmatch(latest)
              if not latest_match:
                  raise SystemExit(f"Latest upstream release is not stable: {latest}")
              latest_core = tuple(map(int, latest_match.groups()))
              if channel == "stable":
                  tag = requested or latest
                  if not tag.startswith("v"):
                      tag = "v" + tag
                  if not stable.fullmatch(tag) or tag not in remote:
                      raise SystemExit(f"Not an upstream stable tag: {tag}")
                  release = get(f"{api}/releases/tags/{tag}")
                  if release.get("draft") or release.get("prerelease"):
                      raise SystemExit(f"Not a published stable release: {tag}")
                  result.append({"channel": channel, "tag": tag, "ref": tag,
                                 "source_repo": "OutlineFoundation/tunnel-server",
                                 "latest": tag == latest})
              elif requested:
                  tag = requested if requested.startswith("v") else "v" + requested
                  match = prerelease.fullmatch(tag) if not tag.endswith("-dbby") else None
                  if not match or tag not in remote:
                      raise SystemExit(f"Not an upstream prerelease tag: {tag}")
                  if tuple(map(int, match.groups()[:3])) <= latest_core:
                      raise SystemExit(f"Prerelease is not newer than stable: {tag}")
                  result.append({"channel": channel, "tag": tag, "ref": tag,
                                 "source_repo": "OutlineFoundation/tunnel-server",
                                 "latest": False})
              else:
                  found = []
                  for tag in remote:
                      match = prerelease.fullmatch(tag) if not tag.endswith("-dbby") else None
                      if match and tuple(map(int, match.groups()[:3])) > latest_core:
                          found.append((tuple(map(int, match.groups()[:3])), tag))
                  result = [{"channel": channel, "tag": tag, "ref": tag,
                             "source_repo": "OutlineFoundation/tunnel-server",
                             "latest": False} for _, tag in sorted(found)]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"has_targets={str(bool(result)).lower()}\n")
              out.write("targets=" + json.dumps(result, separators=(",", ":")) + "\n")
          print("channel=" + channel)
          for item in result:
              print("release_tag=" + item["tag"])
          if not result:
              print("No fork dbby tags need a build." if channel == "dbby"
                    else "No upstream prerelease tags need a build.")
          PY

  build:
    needs: resolve
    if: needs.resolve.outputs.has_targets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: ${{ fromJSON(needs.resolve.outputs.targets) }}
    steps:
      - name: Checkout wrapper repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Checkout exact source tag or commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ matrix.target.source_repo }}
          ref: ${{ matrix.target.ref }}
          path: upstream
          submodules: recursive
          persist-credentials: false

      - name: Verify exact source and read version
        id: source
        env:
          CHANNEL: ${{ matrix.target.channel }}
          RELEASE_TAG: ${{ matrix.target.tag }}
          SOURCE_REF: ${{ matrix.target.ref }}
          SOURCE_REPO: ${{ matrix.target.source_repo }}
          EXPECTED_SHA: ${{ matrix.target.sha }}
          LATEST_STABLE: ${{ matrix.target.latest }}
          UPSTREAM_BASE_REPO: ${{ matrix.target.upstream_base_repo }}
          UPSTREAM_BASE_REF: ${{ matrix.target.upstream_base_ref }}
          UPSTREAM_BASE_SHA: ${{ matrix.target.upstream_base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git -C upstream rev-parse HEAD)"
          if [ -n "$EXPECTED_SHA" ]; then test "$sha" = "$EXPECTED_SHA"; fi
          if [ "$CHANNEL" != development ]; then
            test "$sha" = "$(git -C upstream rev-parse "refs/tags/$SOURCE_REF^{commit}")"
          fi
          if [ "$CHANNEL" = dbby ]; then
            if [ "$(git -C upstream rev-parse --is-shallow-repository)" = true ]; then
              git -C upstream fetch --unshallow --no-tags origin "$SOURCE_REF"
            fi
            if ! git -C upstream merge-base --is-ancestor "$UPSTREAM_BASE_SHA" "$sha"; then
              echo "Fork source does not descend from the recorded upstream base" >&2
              exit 1
            fi
          fi
          epoch="$(git -C upstream show -s --format=%ct HEAD)"
          source_date="$(date -u -d "@$epoch" '+%F')"
          if [ "$CHANNEL" = development ]; then
            tag="dev-$(LC_ALL=C date -u -d "@$epoch" '+%y%b%d')-$(git -C upstream rev-parse --short=12 HEAD)"
            test "$tag" = "$RELEASE_TAG"
            version="$tag"
            method=source-build
          else
            version="$(printf '%s' "$RELEASE_TAG" | sed 's/^v//')"
            if [ "$CHANNEL" = stable ]; then method=upstream-release-archive; else method=source-build; fi
          fi
          if [ "$CHANNEL" = stable ]; then
            go_version=""
          else
            go_version="$(python3 - <<'PY'
          from pathlib import Path
          import re
          import os
          values = {}
          for line in Path("upstream/go.mod").read_text().splitlines():
              fields = line.split()
              if fields and fields[0] in {"go", "toolchain"}:
                  values[fields[0]] = fields[1]
          def parse(value):
              version = value.removeprefix("go")
              if not re.fullmatch(r"\d+\.\d+(?:\.\d+)?", version):
                  raise SystemExit(f"unsupported Go version: {value!r}")
              parts = tuple(map(int, version.split(".")))
              return parts + (0,) * (3 - len(parts))
          if os.environ.get("CHANNEL") == "dbby":
              candidates = [(1, 24, 8)]
              candidates.extend(parse(value) for value in values.values())
              version = ".".join(map(str, max(candidates)))
          else:
              version = values.get("toolchain", values.get("go", "")).removeprefix("go")
              if not re.fullmatch(r"\d+\.\d+(?:\.\d+)?", version):
                  raise SystemExit(f"unsupported Go version: {version!r}")
          print(version)
          PY
          )"
          fi
          {
            echo "sha=$sha"
            echo "epoch=$epoch"
            echo "source_date=$source_date"
            echo "version=$version"
            echo "go_version=$go_version"
            echo "source_repo=$SOURCE_REPO"
            echo "upstream_base_repo=$UPSTREAM_BASE_REPO"
            echo "upstream_base_ref=$UPSTREAM_BASE_REF"
            echo "upstream_base_sha=$UPSTREAM_BASE_SHA"
            echo "archive=outline-ss-server_${version}_linux_x86_64.tar.gz"
            echo "method=$method"
            echo "latest=$LATEST_STABLE"
          } >> "$GITHUB_OUTPUT"
          echo "upstream_commit=$sha"
          echo "upstream_commit_date_utc=$source_date"
          echo "release_tag=$RELEASE_TAG"

      - name: Check existing release and its checksums
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ matrix.target.channel }}
          RELEASE_TAG: ${{ matrix.target.tag }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_REPO: ${{ steps.source.outputs.source_repo }}
          SOURCE_REF: ${{ matrix.target.ref }}
          UPSTREAM_BASE_REPO: ${{ steps.source.outputs.upstream_base_repo }}
          UPSTREAM_BASE_REF: ${{ steps.source.outputs.upstream_base_ref }}
          UPSTREAM_BASE_SHA: ${{ steps.source.outputs.upstream_base_sha }}
          VERSION: ${{ steps.source.outputs.version }}
          ARCHIVE: ${{ steps.source.outputs.archive }}
          METHOD: ${{ steps.source.outputs.method }}
          LATEST: ${{ steps.source.outputs.latest }}
        shell: bash
        run: |
          set -euo pipefail
          route="/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG"
          response="$RUNNER_TEMP/release-$GITHUB_RUN_ID.json"
          error="$RUNNER_TEMP/release-$GITHUB_RUN_ID.err"
          if ! gh api "$route" >"$response" 2>"$error"; then
            if grep -q 'HTTP 404' "$error"; then
              {
                echo "skip=false"
                echo "release_id="
                echo "draft=false"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat "$error" >&2
            exit 1
          fi
          release_id="$(jq -r '.id' "$response")"
          draft="$(jq -r '.draft' "$response")"
          pre=false
          if [ "$CHANNEL" != stable ]; then pre=true; fi
          test "$(jq -r '.prerelease' "$response")" = "$pre"
          if [ "$draft" = true ]; then
            body="$(jq -r '.body' "$response")"
            grep -Fq 'Standalone Linux amd64 Outline tunnel-server binary.' <<< "$body"
            grep -Fq "Channel: $CHANNEL" <<< "$body"
            grep -Fq "https://github.com/$SOURCE_REPO/commit/$SOURCE_SHA" <<< "$body"
            mapfile -t draft_names < <(jq -r '.assets[].name' "$response")
            for name in "${draft_names[@]}"; do
              case "$name" in "$ARCHIVE"|checksums.txt|build-info.json) ;; *)
                echo "Draft contains unexpected asset: $name" >&2; exit 1;; esac
            done
            draft_dir="$RUNNER_TEMP/draft-check-$GITHUB_RUN_ID"
            mkdir -p "$draft_dir"
            if [ "${#draft_names[@]}" -gt 0 ]; then
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$draft_dir"
            fi
            if [ -f "$draft_dir/build-info.json" ]; then
              if [ "$CHANNEL" = dbby ]; then
                jq -e --arg channel "$CHANNEL" --arg tag "$RELEASE_TAG" \
                  --arg version "$VERSION" --arg sha "$SOURCE_SHA" \
                  --arg repo "$SOURCE_REPO" --arg ref "$SOURCE_REF" \
                  --arg base_repo "$UPSTREAM_BASE_REPO" --arg base_ref "$UPSTREAM_BASE_REF" \
                  --arg base_sha "$UPSTREAM_BASE_SHA" \
                  '.channel == $channel and .release_tag == $tag and
                   .version == $version and .source.repository == $repo and
                   .source.ref == $ref and .source.commit == $sha and
                   .upstream_base.repository == $base_repo and
                   .upstream_base.ref == $base_ref and
                   .upstream_base.commit == $base_sha' \
                  "$draft_dir/build-info.json" >/dev/null
              else
                jq -e --arg channel "$CHANNEL" --arg tag "$RELEASE_TAG" \
                  --arg version "$VERSION" --arg sha "$SOURCE_SHA" \
                  '.channel == $channel and .release_tag == $tag and
                   .version == $version and .upstream.commit == $sha' \
                  "$draft_dir/build-info.json" >/dev/null
              fi
            fi
            {
              echo "skip=false"
              echo "release_id=$release_id"
              echo "draft=true"
            } >> "$GITHUB_OUTPUT"
            echo "Resuming an interrupted workflow-owned draft release."
            exit 0
          fi
          dir="$RUNNER_TEMP/release-assets-$GITHUB_RUN_ID"
          mkdir -p "$dir"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$dir"
          expected="$(printf '%s\n' "$ARCHIVE" checksums.txt build-info.json | sort | paste -sd '\n' -)"
          actual="$(find "$dir" -maxdepth 1 -type f -printf '%f\n' | sort | paste -sd '\n' -)"
          test "$expected" = "$actual"
          (cd "$dir" && sha256sum --check checksums.txt)
          jq -e --arg channel "$CHANNEL" --arg tag "$RELEASE_TAG" \
            --arg version "$VERSION" --arg sha "$SOURCE_SHA" \
            --arg repo "$SOURCE_REPO" --arg ref "$SOURCE_REF" \
            --arg base_repo "$UPSTREAM_BASE_REPO" --arg base_ref "$UPSTREAM_BASE_REF" \
            --arg base_sha "$UPSTREAM_BASE_SHA" \
            --arg archive "$ARCHIVE" --arg method "$METHOD" \
            '.schema_version == 1 and .channel == $channel and
             .release_tag == $tag and .version == $version and
             (if $channel == "dbby" then
                .source.repository == $repo and .source.ref == $ref and
                .source.commit == $sha and
                .upstream_base.repository == $base_repo and
                .upstream_base.ref == $base_ref and .upstream_base.commit == $base_sha
              else .upstream.commit == $sha end) and
             .platform.os == "linux" and
             .platform.architecture == "amd64" and .build.method == $method and
             .archive.name == $archive and
             (if $channel == "stable" then
                .build.upstream_release_asset_sha256 == .archive.sha256
              else true end)' "$dir/build-info.json" >/dev/null
          test "$(sha256sum "$dir/$ARCHIVE" | cut -d' ' -f1)" = \
            "$(jq -r '.archive.sha256' "$dir/build-info.json")"
          {
            echo "skip=true"
            echo "release_id=$release_id"
            echo "draft=false"
          } >> "$GITHUB_OUTPUT"
          if [ "$CHANNEL" = stable ] && [ "$LATEST" = true ]; then
            test "$(gh api "/repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$RELEASE_TAG"
          fi
          echo "Existing release is valid and matches upstream source."

      - name: Set up Go
        if: matrix.target.channel != 'stable' && steps.existing.outputs.skip != 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ steps.source.outputs.go_version }}
          cache-dependency-path: upstream/go.sum

      - name: Run upstream build and tests
        if: matrix.target.channel != 'stable' && matrix.target.channel != 'dbby' && steps.existing.outputs.skip != 'true'
        working-directory: upstream
        run: |
          set -euo pipefail
          git submodule update --init --recursive
          go build -v ./...
          go test -race -benchmem -bench=. ./... -benchtime=100ms

      - name: Run fork release regression review packet
        if: matrix.target.channel == 'dbby' && steps.existing.outputs.skip != 'true'
        working-directory: upstream
        env:
          GO_BIN: go
        run: ./scripts/review-packet-websocket.sh

      - name: Download and verify stable upstream archive
        if: matrix.target.channel == 'stable' && steps.existing.outputs.skip != 'true'
        env:
          RELEASE_TAG: ${{ matrix.target.tag }}
          ARCHIVE: ${{ steps.source.outputs.archive }}
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/outline-binary-$GITHUB_RUN_ID"
          mkdir -p "$dir"
          base="https://github.com/OutlineFoundation/tunnel-server/releases/download/$RELEASE_TAG"
          curl --fail --show-error --location --retry 3 "$base/checksums.txt" -o "$dir/upstream-checksums.txt"
          curl --fail --show-error --location --retry 3 "$base/$ARCHIVE" -o "$dir/$ARCHIVE"
          expected="$(awk -v name="$ARCHIVE" '$2 == name {print $1}' "$dir/upstream-checksums.txt")"
          if ! [[ "$expected" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Missing or malformed upstream checksum for $ARCHIVE" >&2
            exit 1
          fi
          echo "$expected  $dir/$ARCHIVE" | sha256sum --check
          tar -tzf "$dir/$ARCHIVE" | grep -Fxq outline-ss-server
          tar -xzf "$dir/$ARCHIVE" -C "$dir" outline-ss-server
          chmod 0755 "$dir/outline-ss-server"
          echo "UPSTREAM_ASSET_SHA256=$expected" >> "$GITHUB_ENV"

      - name: Build prerelease or development source
        if: matrix.target.channel != 'stable' && steps.existing.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.source.outputs.version }}
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/outline-binary-$GITHUB_RUN_ID"
          mkdir -p "$dir"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOWORK=off GOTOOLCHAIN=local \
            go build -trimpath -buildvcs=false -ldflags="-X main.version=$VERSION" \
            -o "$dir/outline-ss-server" ./cmd/outline-ss-server
          chmod 0755 "$dir/outline-ss-server"
          echo "UPSTREAM_ASSET_SHA256=" >> "$GITHUB_ENV"

      - name: Validate, package, and record provenance
        if: steps.existing.outputs.skip != 'true'
        env:
          CHANNEL: ${{ matrix.target.channel }}
          RELEASE_TAG: ${{ matrix.target.tag }}
          SOURCE_REF: ${{ matrix.target.ref }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_DATE: ${{ steps.source.outputs.source_date }}
          SOURCE_EPOCH: ${{ steps.source.outputs.epoch }}
          VERSION: ${{ steps.source.outputs.version }}
          ARCHIVE: ${{ steps.source.outputs.archive }}
          METHOD: ${{ steps.source.outputs.method }}
          GO_VERSION: ${{ steps.source.outputs.go_version }}
          SOURCE_REPO: ${{ steps.source.outputs.source_repo }}
          UPSTREAM_BASE_REPO: ${{ steps.source.outputs.upstream_base_repo }}
          UPSTREAM_BASE_REF: ${{ steps.source.outputs.upstream_base_ref }}
          UPSTREAM_BASE_SHA: ${{ steps.source.outputs.upstream_base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/outline-binary-$GITHUB_RUN_ID"
          binary="$dir/outline-ss-server"
          test -x "$binary"
          readelf -h "$binary" | grep -Fq 'Advanced Micro Devices X86-64'
          test "$("$binary" -version 2>&1)" = "$VERSION"
          config="$GITHUB_WORKSPACE/upstream/cmd/outline-ss-server/config_example.yml"
          log="$dir/startup.log"
          "$binary" -config="$config" >"$log" 2>&1 &
          pid=$!
          cleanup() { kill "$pid" >/dev/null 2>&1 || true; wait "$pid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          ready=false
          for attempt in $(seq 1 20); do
            if ! kill -0 "$pid" >/dev/null 2>&1; then cat "$log" >&2; exit 1; fi
            if grep -Fq 'Web server started.' "$log" &&
               grep -Fq 'TCP service started.' "$log" &&
               grep -Fq 'UDP service started.' "$log"; then ready=true; break; fi
            sleep 1
          done
          cat "$log"
          test "$ready" = true
          cleanup
          trap - EXIT
          echo "web_tcp_udp_startup=verified"

          archive="$dir/$ARCHIVE"
          if [ "$METHOD" = source-build ]; then
            stage="$dir/stage"
            mkdir -p "$stage"
            install -m 0755 "$binary" "$stage/outline-ss-server"
            install -m 0644 upstream/LICENSE "$stage/LICENSE"
            install -m 0644 upstream/README.md "$stage/README.md"
            tar --sort=name --owner=0 --group=0 --numeric-owner \
              --mtime="@$SOURCE_EPOCH" --format=ustar -C "$stage" \
              -cf - LICENSE README.md outline-ss-server | gzip -n >"$archive"
          fi
          archive_sha="$(sha256sum "$archive" | cut -d' ' -f1)"
          if [ "$CHANNEL" = stable ]; then test "$archive_sha" = "$UPSTREAM_ASSET_SHA256"; fi
          jq -n \
            --arg channel "$CHANNEL" --arg tag "$RELEASE_TAG" --arg version "$VERSION" \
            --arg ref "$SOURCE_REF" --arg sha "$SOURCE_SHA" --arg date "$SOURCE_DATE" \
            --arg source_repo "$SOURCE_REPO" \
            --arg upstream_base_repo "$UPSTREAM_BASE_REPO" \
            --arg upstream_base_ref "$UPSTREAM_BASE_REF" \
            --arg upstream_base_sha "$UPSTREAM_BASE_SHA" \
            --arg wrapper "$GITHUB_REPOSITORY" --arg wrapper_sha "$GITHUB_SHA" \
            --arg method "$METHOD" --arg go "$GO_VERSION" --arg archive "$ARCHIVE" \
            --arg archive_sha "$archive_sha" --arg upstream_sha "$UPSTREAM_ASSET_SHA256" \
            '{
              schema_version: 1, channel: $channel, release_tag: $tag, version: $version,
              platform: {os:"linux", architecture:"amd64"},
              upstream: {repository:$source_repo, ref:$ref,
                         commit:$sha, commit_date_utc:$date},
              source: {repository:$source_repo, ref:$ref,
                       commit:$sha, commit_date_utc:$date},
              upstream_base:(if $channel == "dbby" then
                {repository:$upstream_base_repo, ref:$upstream_base_ref,
                 commit:$upstream_base_sha}
                else null end),
              wrapper: {repository:$wrapper, commit:$wrapper_sha},
              build: {method:$method,
                     go_version:(if $go == "" then null else $go end),
                     flags:(if $method == "source-build" then
                       ["CGO_ENABLED=0","GOOS=linux","GOARCH=amd64","GOWORK=off",
                        "GOTOOLCHAIN=local","-trimpath","-buildvcs=false",
                        ("-ldflags=-X main.version=" + $version)] else null end),
                     upstream_release_asset_sha256:
                       (if $upstream_sha == "" then null else $upstream_sha end)},
              archive: {name:$archive, sha256:$archive_sha}
            }' > "$dir/build-info.json"
          (cd "$dir" && sha256sum "$ARCHIVE" build-info.json | LC_ALL=C sort -k2 > checksums.txt)
          cat "$dir/build-info.json"
          cat "$dir/checksums.txt"

      - name: Publish release assets
        if: steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ matrix.target.channel }}
          RELEASE_TAG: ${{ matrix.target.tag }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_REPO: ${{ steps.source.outputs.source_repo }}
          SOURCE_REF: ${{ matrix.target.ref }}
          UPSTREAM_BASE_REPO: ${{ steps.source.outputs.upstream_base_repo }}
          UPSTREAM_BASE_REF: ${{ steps.source.outputs.upstream_base_ref }}
          UPSTREAM_BASE_SHA: ${{ steps.source.outputs.upstream_base_sha }}
          LATEST: ${{ steps.source.outputs.latest }}
          ARCHIVE: ${{ steps.source.outputs.archive }}
          DRAFT_ID: ${{ steps.existing.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/outline-binary-$GITHUB_RUN_ID"
          notes="$dir/release-notes.md"
          printf 'Standalone Linux amd64 Outline tunnel-server binary.\n\nChannel: %s\nSource commit: https://github.com/%s/commit/%s\n' \
            "$CHANNEL" "$SOURCE_REPO" "$SOURCE_SHA" > "$notes"
          if [ "$CHANNEL" = dbby ]; then
            printf 'Upstream base tag: %s (https://github.com/%s/commit/%s)\n' \
              "$UPSTREAM_BASE_REF" "$UPSTREAM_BASE_REPO" "$UPSTREAM_BASE_SHA" >> "$notes"
          fi
          printf 'The checksums.txt asset covers the archive and build-info.json.\n' >> "$notes"
          if [ -n "$DRAFT_ID" ]; then
            route="/repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID"
            release="$(gh api "$route")"
            mapfile -t names < <(jq -r '.assets[].name' <<< "$release")
            expected_names=("$ARCHIVE" checksums.txt build-info.json)
            for name in "${names[@]}"; do
              found=false
              for expected in "${expected_names[@]}"; do
                if [ "$name" = "$expected" ]; then found=true; fi
              done
              if [ "$found" != true ]; then echo "Unexpected draft asset: $name" >&2; exit 1; fi
            done
            verify_dir="$RUNNER_TEMP/draft-assets-$GITHUB_RUN_ID"
            mkdir -p "$verify_dir"
            upload=()
            for name in "${expected_names[@]}"; do
              present=false
              for existing in "${names[@]}"; do
                if [ "$existing" = "$name" ]; then present=true; fi
              done
              if [ "$present" = true ]; then
                gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                  --pattern "$name" --dir "$verify_dir"
                cmp -s "$dir/$name" "$verify_dir/$name" || {
                  echo "Refusing to replace conflicting draft asset: $name" >&2; exit 1;
                }
              else
                upload+=("$dir/$name")
              fi
            done
            if [ "${#upload[@]}" -gt 0 ]; then
              gh release upload "$RELEASE_TAG" "${upload[@]}" --repo "$GITHUB_REPOSITORY"
            fi
            if [ "$CHANNEL" = stable ] && [ "$LATEST" = true ]; then latest=true; else latest=false; fi
            pre=false
            if [ "$CHANNEL" != stable ]; then pre=true; fi
            gh api --method PATCH "$route" -F draft=false \
              -F "prerelease=$pre" -f "make_latest=$latest" >/dev/null
          elif [ "$CHANNEL" = stable ] && [ "$LATEST" = true ]; then
            gh release create "$RELEASE_TAG" "$dir/$ARCHIVE" "$dir/checksums.txt" "$dir/build-info.json" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Outline $RELEASE_TAG (linux/amd64)" --notes-file "$notes" --latest
          elif [ "$CHANNEL" = stable ]; then
            gh release create "$RELEASE_TAG" "$dir/$ARCHIVE" "$dir/checksums.txt" "$dir/build-info.json" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Outline $RELEASE_TAG (linux/amd64)" --notes-file "$notes" --latest=false
          else
            gh release create "$RELEASE_TAG" "$dir/$ARCHIVE" "$dir/checksums.txt" "$dir/build-info.json" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Outline $RELEASE_TAG (linux/amd64)" --notes-file "$notes" \
              --prerelease --latest=false
          fi
          echo "release=https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
          cat "$dir/checksums.txt"

      - name: Verify published release assets
        if: steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ matrix.target.channel }}
          RELEASE_TAG: ${{ matrix.target.tag }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_REPO: ${{ steps.source.outputs.source_repo }}
          SOURCE_REF: ${{ matrix.target.ref }}
          UPSTREAM_BASE_REPO: ${{ steps.source.outputs.upstream_base_repo }}
          UPSTREAM_BASE_REF: ${{ steps.source.outputs.upstream_base_ref }}
          UPSTREAM_BASE_SHA: ${{ steps.source.outputs.upstream_base_sha }}
          VERSION: ${{ steps.source.outputs.version }}
          ARCHIVE: ${{ steps.source.outputs.archive }}
          LATEST: ${{ steps.source.outputs.latest }}
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/verify-release-$GITHUB_RUN_ID"
          mkdir -p "$dir"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$dir"
          expected="$(printf '%s\n' "$ARCHIVE" checksums.txt build-info.json | sort | paste -sd '\n' -)"
          actual="$(find "$dir" -maxdepth 1 -type f -printf '%f\n' | sort | paste -sd '\n' -)"
          test "$expected" = "$actual"
          (cd "$dir" && sha256sum --check checksums.txt)
          jq -e --arg channel "$CHANNEL" --arg tag "$RELEASE_TAG" \
            --arg version "$VERSION" --arg sha "$SOURCE_SHA" \
            --arg repo "$SOURCE_REPO" --arg ref "$SOURCE_REF" \
            --arg base_repo "$UPSTREAM_BASE_REPO" --arg base_ref "$UPSTREAM_BASE_REF" \
            --arg base_sha "$UPSTREAM_BASE_SHA" \
            '.channel == $channel and .release_tag == $tag and
             .version == $version and
             (if $channel == "dbby" then
                .source.repository == $repo and .source.ref == $ref and
                .source.commit == $sha and
                .upstream_base.repository == $base_repo and
                .upstream_base.ref == $base_ref and .upstream_base.commit == $base_sha
              else .upstream.commit == $sha end) and
             .platform.os == "linux" and .platform.architecture == "amd64" and
             .archive.sha256 != "" and
             (if $channel == "stable" then
                .build.upstream_release_asset_sha256 == .archive.sha256
              else true end)' "$dir/build-info.json" >/dev/null
          if [ "$CHANNEL" = stable ] && [ "$LATEST" = true ]; then
            test "$(gh api "/repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$RELEASE_TAG"
          fi
          echo "published_release_assets=verified"
