name: Recover verified Outline Caddy publication

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  packages: write

concurrency:
  group: outline-caddy-dbby-v2.11.7
  cancel-in-progress: false

jobs:
  recover:
    name: Verify original build and finish publication
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout recovery verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: recovery-tools
          persist-credentials: false

      - name: Checkout original failed producer recipe
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: b7ecd468a6a82a63c1a65a416e8d2f0a1e184896
          path: producer-recipe
          persist-credentials: false

      - name: Checkout exact source tag used by the original build
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: DobbyVPN/outliner-tunnel-server-fork
          ref: outlinecaddy/v0.0.2-dbby
          path: producer-recipe/source
          fetch-depth: 0
          persist-credentials: false

      - name: Verify original producer run, recipe, and preview artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 recovery-tools/scripts/verify-caddy-dbby-producer.py \
            --lock recovery-tools/caddy-dbby-recovery.lock.json \
            --recipe-dir producer-recipe \
            --output-dir producer-recipe/out/recovery

      - name: Download the exact original review artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: outline-caddy-preview-37661966790-1
          run-id: 37661966790
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: producer-recipe/out

      - name: Set up pinned Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.8
          cache: false

      - name: Enable emulation for platform smoke checks
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up pinned Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          version: v0.37.2

      - name: Log in to GHCR for verified child pulls and alias update
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify immutable image and complete prerelease publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCER_RECIPE_DIR: producer-recipe
        shell: bash
        run: |
          set -euo pipefail
          recovery-tools/scripts/recover-caddy-dbby-publication.sh

      - name: Upload publication recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: outline-caddy-publication-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            producer-recipe/out/recovery/
            producer-recipe/out/build-info.json
            producer-recipe/out/checksums.txt
            producer-recipe/out/logs/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
