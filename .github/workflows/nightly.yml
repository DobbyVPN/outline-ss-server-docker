name: Nightly Docker Build

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Force a specific version tag (e.g. v1.2.3). Leave empty to use latest.'
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Set image base
        id: image
        run: echo "base=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/outline-ss-server" >> "$GITHUB_OUTPUT"

      - name: Set immutable source tag
        id: source
        run: printf 'tag=commit-%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Get latest tunnel-server release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(curl --fail --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              https://api.github.com/repos/OutlineFoundation/tunnel-server/releases/latest \
              | jq -r '.tag_name')
          fi
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Failed to get release version" && exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image already exists
        id: check
        run: |
          if docker manifest inspect "${{ steps.image.outputs.base }}:${{ steps.source.outputs.tag }}"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Source tag ${{ steps.source.outputs.tag }} already in GHCR, skipping build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check.outputs.exists == 'false'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify exact clean source checkout
        if: steps.check.outputs.exists == 'false'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up QEMU
        if: steps.check.outputs.exists == 'false'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'false'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build and push
        id: build
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          push: true
          tags: |
            ${{ steps.image.outputs.base }}:${{ steps.release.outputs.version }}
            ${{ steps.image.outputs.base }}:latest
            ${{ steps.image.outputs.base }}:${{ steps.source.outputs.tag }}
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            VCS_REF=${{ github.sha }}

      - name: Record immutable image identity
        if: steps.check.outputs.exists == 'false'
        run: |
          printf 'source_commit=%s\n' "$GITHUB_SHA"
          printf 'upstream_version=%s\n' "${{ steps.release.outputs.version }}"
          printf 'image=%s@%s\n' "${{ steps.image.outputs.base }}" "${{ steps.build.outputs.digest }}"

      - name: Verify published runtime defaults
        if: steps.check.outputs.exists == 'false'
        env:
          IMAGE_REF: ${{ steps.image.outputs.base }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$IMAGE_REF"
          docker image inspect "$IMAGE_REF"
          python3 - "$IMAGE_REF" <<'PY'
          import json
          import subprocess
          import sys

          image = json.loads(subprocess.check_output(
              ["docker", "image", "inspect", sys.argv[1]],
              text=True,
          ))
          if len(image) != 1:
              raise SystemExit("published image inspection was not singular")
          config = image[0].get("Config")
          if not isinstance(config, dict):
              raise SystemExit("published image config is missing")
          if config.get("Entrypoint") != ["/outline-ss-server"]:
              raise SystemExit("published image entrypoint is incorrect")
          if config.get("Cmd") != ["-config=/etc/secrets/config.yml"]:
              raise SystemExit("published image default config command is incorrect")
          print("published_runtime_defaults=verified")
          PY
