name: Nightly Docker Build

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Force a specific version tag (e.g. v1.2.3). Leave empty to use latest.'
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set image base
        id: image
        run: echo "base=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/outline-ss-server" >> "$GITHUB_OUTPUT"

      - name: Set immutable source tag
        id: source
        run: printf 'tag=commit-%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Get latest tunnel-server release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(curl --fail --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              https://api.github.com/repos/OutlineFoundation/tunnel-server/releases/latest \
              | jq -r '.tag_name')
          fi
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Failed to get release version" && exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image already exists
        id: check
        run: |
          if docker manifest inspect "${{ steps.image.outputs.base }}:${{ steps.source.outputs.tag }}"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Source tag ${{ steps.source.outputs.tag }} already in GHCR, skipping build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check.outputs.exists == 'false'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU
        if: steps.check.outputs.exists == 'false'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'false'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push
        id: build
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          push: true
          tags: |
            ${{ steps.image.outputs.base }}:${{ steps.release.outputs.version }}
            ${{ steps.image.outputs.base }}:latest
            ${{ steps.image.outputs.base }}:${{ steps.source.outputs.tag }}
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            VCS_REF=${{ github.sha }}

      - name: Record immutable image identity
        if: steps.check.outputs.exists == 'false'
        run: |
          printf 'source_commit=%s\n' "$GITHUB_SHA"
          printf 'upstream_version=%s\n' "${{ steps.release.outputs.version }}"
          printf 'image=%s@%s\n' "${{ steps.image.outputs.base }}" "${{ steps.build.outputs.digest }}"
